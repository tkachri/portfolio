    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .folder-annotation {
        position: absolute;
        pointer-events: none;
        z-index: 20;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 200ms ease, transform 200ms ease;
      }

      .folder-annotation.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .folder-annotation-inner {
        display: flex;
        align-items: center;
        gap: 8px;
        max-width: 180px;
      }

      .folder-annotation-inner.left {
        flex-direction: row-reverse;
      }

      .folder-annotation-inner.up-right,
      .folder-annotation-inner.up-left {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }

      .folder-annotation-svg {
        width: 86px;
        height: 32px;
        overflow: visible;
      }

      .folder-annotation-line,
      .folder-annotation-head {
        stroke: #2c1f14;
        stroke-width: 1.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: draw-arrow 300ms ease-out forwards;
      }

      .folder-annotation-head {
        stroke-dasharray: 16;
        stroke-dashoffset: 16;
      }

      .folder-annotation-text {
        background: #f5f0e6;
        border: 1px solid #ede8dc;
        border-radius: 6px;
        padding: 8px 12px;
        max-width: 160px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        font-family: "Caveat", cursive;
        font-size: 15px;
        line-height: 1.5;
        color: #2c1f14;
        opacity: 0;
        transform: translateY(2px);
        transition: opacity 200ms ease 300ms, transform 200ms ease 300ms;
      }

      .folder-annotation.is-visible .folder-annotation-text {
        opacity: 1;
        transform: translateY(0);
      }

      @keyframes draw-arrow {
        to {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>

    <script src="script.js"></script>
    <script>
      const folderLinks = Array.from(document.querySelectorAll('.folder[href]'));

      const buildAnnotation = (folder) => {
        const description = folder.dataset.description || '';
        const direction = folder.dataset.direction || 'right';
        const annotation = document.createElement('div');
        annotation.className = 'folder-annotation';

        let svgPath = '';
        let headPath = '';
        let wrapperClass = 'inner';
        let wrapperStyle = '';

        if (direction === 'right') {
          svgPath = 'M 6 16 L 74 16';
          headPath = 'M 70 10 L 82 16 L 70 22';
          wrapperClass = 'folder-annotation-inner';
          wrapperStyle = 'left: calc(100% + 16px); top: 50%; transform: translateY(-50%);';
        } else if (direction === 'left') {
          svgPath = 'M 80 16 L 12 16';
          headPath = 'M 16 10 L 4 16 L 16 22';
          wrapperClass = 'folder-annotation-inner left';
          wrapperStyle = 'right: calc(100% + 16px); top: 50%; transform: translateY(-50%);';
        } else if (direction === 'up-right') {
          svgPath = 'M 6 24 L 58 8';
          headPath = 'M 54 10 L 66 4 L 62 16';
          wrapperClass = 'folder-annotation-inner up-right';
          wrapperStyle = 'left: calc(100% + 12px); top: -2px;';
        } else if (direction === 'up-left') {
          svgPath = 'M 80 24 L 28 8';
          headPath = 'M 32 10 L 20 4 L 24 16';
          wrapperClass = 'folder-annotation-inner up-left';
          wrapperStyle = 'right: calc(100% + 12px); top: -2px;';
        }

        annotation.innerHTML = `
          <div class="${wrapperClass}" style="${wrapperStyle}">
            <svg class="folder-annotation-svg" viewBox="0 0 86 32" aria-hidden="true">
              <path class="folder-annotation-line" d="${svgPath}" />
              <path class="folder-annotation-head" d="${headPath}" />
            </svg>
            <div class="folder-annotation-text">${description}</div>
          </div>
        `;

        return annotation;
      };

      folderLinks.forEach((folder) => {
        folder.addEventListener('mouseenter', () => {
          const existing = folder.querySelector('.folder-annotation');
          if (existing) {
            existing.remove();
          }
          const annotation = buildAnnotation(folder);
          folder.appendChild(annotation);
          requestAnimationFrame(() => annotation.classList.add('is-visible'));
        });

        folder.addEventListener('mouseleave', () => {
          const annotation = folder.querySelector('.folder-annotation');
          if (annotation) {
            annotation.classList.remove('is-visible');
            annotation.remove();
          }
        });
      });
    </script>
