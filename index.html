<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theodora Kachrimanidi</title>
    <meta name="description" content="Portfolio of Theodora Kachrimanidi, product manager and UX researcher." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body.page-index {
        background: #f5f0e6;
        color: #2c1f14;
      }

      main {
        background: #f5f0e6;
      }

      .hero-section {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 120px 24px 80px;
        background: #f5f0e6;
        overflow: hidden;
      }

      .hero-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 16px;
      }

      #hero-name {
        margin: 0;
        font-family: "Playfair Display", serif;
        font-size: clamp(52px, 10vw, 120px);
        font-weight: 700;
        line-height: 1;
        color: #2c1f14;
        letter-spacing: -0.03em;
        transform: translateY(0);
        opacity: 1;
        transition: opacity 180ms ease-out, transform 180ms ease-out, font-size 180ms ease-out;
      }

      .typewriter-wrap {
        min-height: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .typewriter {
        font-family: "Inter", sans-serif;
        font-size: 13px;
        font-style: italic;
        color: #8a7a6a;
        opacity: 1;
        transition: opacity 400ms ease;
      }

      .typewriter.fade-out {
        opacity: 0;
      }

      .hero-pill {
        display: inline-block;
        padding: 5px 16px;
        border: 1px solid #7eb8c9;
        border-radius: 20px;
        color: #7eb8c9;
        font-family: "Inter", sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .hero-bounce {
        position: absolute;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        color: #8a7a6a;
        animation: bounce 1.2s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(6px);
        }
      }

      .gallery-section {
        position: relative;
        min-height: 300vh;
        overflow: hidden;
        background: #f5f0e6;
        padding: 0 0 120px;
      }

      .gallery-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      .gallery-spine {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1;
        pointer-events: none;
      }

      .gallery-spine span {
        display: block;
        margin: 4px 0;
        font-family: "Playfair Display", serif;
        font-size: clamp(28px, 3vw, 42px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: 0.05em;
        color: #2c1f14;
        opacity: 0.15;
      }

      .gallery-photo {
        position: absolute;
        display: block;
        object-fit: cover;
        border: 0;
        border-radius: 0;
        pointer-events: none;
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 600ms ease-out, transform 600ms ease-out;
        z-index: 2;
      }

      .gallery-photo.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .mobile-note {
        display: none;
      }

      @media (max-width: 768px) {
        .gallery-photo {
          display: none;
        }

        .gallery-section {
          min-height: 180vh;
        }

        .mobile-note {
          display: grid;
          place-items: center;
          position: absolute;
          inset: 0;
          padding: 24px;
          text-align: center;
          font-family: "Inter", sans-serif;
          font-size: 14px;
          font-style: italic;
          color: #8a7a6a;
          z-index: 2;
        }
      }
    </style>
  </head>
  <body class="page-index">
    <nav class="site-nav">
      <a class="nav-logo" href="index.html">itstheodok</a>
      <div class="nav-links">

        <a class="nav-link" data-page="about" href="about.html">about</a>

    <main>

      <section class="gallery-section" aria-label="Editorial gallery">

        <div class="gallery-spine" aria-hidden="true">
          <span>t</span>
          <span>h</span>
          <span>e</span>
          <span>o</span>
          <span>d</span>
          <span>o</span>

        </div>
        <div class="gallery-photos">
          <img class="gallery-photo" src="apartment_market.jpeg" alt="Apartment market storefront interior in warm light" style="width: 280px; height: 380px; left: 2%; top: 2%; z-index: 1;" />
          <img class="gallery-photo" src="eiffel_bar.jpeg" alt="Bar scene beneath the Eiffel influence" style="width: 340px; height: 220px; left: 38%; top: 6%; z-index: 2;" />
          <img class="gallery-photo" src="library.jpeg" alt="Library interior with layered shadow and quiet detail" style="width: 200px; height: 280px; right: 3%; top: 4%; z-index: 1;" />
          <img class="gallery-photo" src="apartment_market.jpeg" alt="Apartment market storefront interior in warm light" style="width: 380px; height: 240px; left: 1%; top: 28%; z-index: 1;" />
          <img class="gallery-photo" src="eiffel_bar.jpeg" alt="Bar scene beneath the Eiffel influence" style="width: 220px; height: 320px; left: 44%; top: 22%; z-index: 2;" />
          <img class="gallery-photo" src="library.jpeg" alt="Library interior with layered shadow and quiet detail" style="width: 260px; height: 180px; right: 2%; top: 30%; z-index: 1;" />
          <img class="gallery-photo" src="apartment_market.jpeg" alt="Apartment market storefront interior in warm light" style="width: 180px; height: 260px; left: 18%; top: 52%; z-index: 1;" />
          <img class="gallery-photo" src="library.jpeg" alt="Library interior with layered shadow and quiet detail" style="width: 320px; height: 200px; left: 36%; top: 58%; z-index: 2;" />

    <div class="cursor-dot" aria-hidden="true"></div>
    <script>
      const phrases = [
        "diagnosing trust breakdowns in user journeys",
        "building products that feel as good as they work",
        "behavioral science applied to real product decisions"
      ];

      const typewriter = document.getElementById("typewriter");
      if (typewriter) {
        let index = 0;
        const rotatePhrase = () => {
          typewriter.classList.add("fade-out");
          window.setTimeout(() => {
            index = (index + 1) % phrases.length;
            typewriter.textContent = phrases[index];
            typewriter.classList.remove("fade-out");
          }, 400);
        };
        typewriter.textContent = phrases[0];
        window.setInterval(rotatePhrase, 3000);
      }

      const heroName = document.getElementById("hero-name");
      if (heroName) {
        const onScroll = () => {
          const progress = Math.min(1, Math.max(0, window.scrollY / 200));
          heroName.style.opacity = String(1 - progress);
          heroName.style.transform = `translateY(${-progress * 20}px)`;
          heroName.style.fontSize = `clamp(${Math.max(40, 52 - progress * 18)}px, ${Math.max(8, 10 - progress * 2.4)}vw, ${Math.max(80, 120 - progress * 40)}px)`;
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
      }

      const photos = Array.from(document.querySelectorAll(".gallery-photo"));
      if (photos.length) {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry, index) => {
              if (entry.isIntersecting) {
                const photo = entry.target;
                const delay = Number(photo.dataset.index || index) * 100;
                window.setTimeout(() => {
                  photo.classList.add("is-visible");
                }, delay);
                observer.unobserve(photo);
              }
            });
          },
          { threshold: 0.15 }
        );

        photos.forEach((photo, index) => {
          photo.dataset.index = index;
          observer.observe(photo);
        });
      }

      const galleryCanvas = document.getElementById("gallery-canvas");
      if (galleryCanvas) {
        const ctx = galleryCanvas.getContext("2d");
        let width = 0;
        let height = 0;
        let dpr = Math.max(1, window.devicePixelRatio || 1);
        let scrollOffset = 0;
        let frameId = 0;

        const rings = Array.from({ length: 40 }, (_, index) => ({
          index,
          phase: index * (Math.PI / 10)
        }));

        const resize = () => {
          width = galleryCanvas.clientWidth;
          height = galleryCanvas.clientHeight;
          dpr = Math.max(1, window.devicePixelRatio || 1);
          galleryCanvas.width = Math.floor(width * dpr);
          galleryCanvas.height = Math.floor(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };

        const drawHelix = () => {
          ctx.clearRect(0, 0, width, height);
          const cx = width / 2;
          const cy = height / 2;
          const radiusX = 380;
          const radiusY = 28;

          rings.forEach((ring, index) => {
            const angle = ring.phase + scrollOffset + index * 0.18;
            const sine = Math.sin(angle);
            const isFront = sine >= 0;
            ctx.strokeStyle = "#7eb8c9";
            ctx.lineWidth = isFront ? 1.2 : 0.6;
            ctx.globalAlpha = isFront ? 0.12 : 0.03;
            ctx.beginPath();

            const steps = 80;
            for (let step = 0; step <= steps; step += 1) {
              const t = step / steps;
              const x = cx + Math.cos(angle + t * Math.PI * 2) * radiusX;
              const y = cy + (t - 0.5) * height * 0.95 + Math.sin(angle + t * Math.PI * 2) * (radiusY + sine * 4);
              if (step === 0) {
                ctx.moveTo(x, y);
              } else {
                ctx.lineTo(x, y);
              }
            }
            ctx.stroke();
          });

          ctx.globalAlpha = 1;
        };

        const render = () => {
          drawHelix();
          frameId = window.requestAnimationFrame(render);
        };

        const updateScroll = () => {
          const section = document.querySelector('.gallery-section');
          if (!section) return;
          const rect = section.getBoundingClientRect();
          const start = rect.top + window.scrollY;
          const end = start + section.offsetHeight - window.innerHeight;
          const current = Math.max(0, Math.min(window.scrollY - start, end - start));
          scrollOffset = current * 0.003;
          if (frameId) {
            window.cancelAnimationFrame(frameId);
          }
          frameId = window.requestAnimationFrame(drawHelix);
        };

        window.addEventListener('scroll', updateScroll, { passive: true });
        window.addEventListener('resize', () => {
          resize();
          updateScroll();
        });

        resize();
        updateScroll();
        render();
      }
    </script>
  </body>
