    <link rel="stylesheet" href="styles.css" />
    <style>
      body.page-index {
        background: #f5f0e6;
        color: #2c1f14;
      }

      main {
        background: #f5f0e6;
      }

      .moodboard-section {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        background: #f5f0e6;
      }

      .moodboard-images {
        position: absolute;
        inset: 0;
      }

      .moodboard-image {
        position: absolute;
        display: block;
        object-fit: cover;
        border: 0;
        border-radius: 0;
        pointer-events: none;
        opacity: 1;
      }

      .moodboard-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 10;
        text-align: center;
        pointer-events: none;
      }

      .moodboard-word {
        font-family: "Playfair Display", serif;
        font-size: clamp(52px, 9vw, 110px);
        font-weight: 700;
        line-height: 0.95;
        color: #2c1f14;
        letter-spacing: -0.03em;
        margin: 0;
      }

      .moodboard-pill {
        display: inline-block;
        margin-top: 16px;
        padding: 5px 16px;
        border: 1px solid #7eb8c9;
        border-radius: 20px;
        color: #7eb8c9;
        font-family: "Inter", sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .spiral-section {
        position: relative;
        height: 100vh;
        overflow: hidden;
        background: #f5f0e6;
      }

      .spiral-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .spiral-copy-wrap {
        position: relative;
        z-index: 1;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .spiral-copy {
        max-width: 500px;
        margin: 0;
        text-align: center;
        font-family: "Inter", sans-serif;
        font-size: 13px;
        font-style: italic;
        line-height: 1.8;
        color: #8a7a6a;
        opacity: 1;
        transition: opacity 0.4s ease;
      }

      .spiral-copy.is-hidden {
        opacity: 0;
      }

      @media (max-width: 768px) {
        .moodboard-image {
          display: none;
        }

        .moodboard-center {
          width: min(90%, 360px);
        }

        .moodboard-word {
          font-size: clamp(48px, 14vw, 68px);
        }
      }
    </style>

          <img class="moodboard-image" src="eiffel_bar.jpeg" alt="Bar scene beneath the Eiffel influence" style="width: 160px; height: 220px; top: 30%; left: 78%; transform: rotate(2deg);" />
          <img class="moodboard-image" src="library.jpeg" alt="Library interior with layered shadow and quiet detail" style="width: 240px; height: 180px; top: 72%; left: 38%; transform: rotate(-1deg);" />
          <img class="moodboard-image" src="apartment_market.jpeg" alt="Apartment market storefront interior in warm light" style="width: 180px; height: 260px; top: 15%; left: 38%; transform: rotate(1deg); opacity: 0.85;" />

    <div class="cursor-dot" aria-hidden="true"></div>
    <script>
      const phrases = [
        "diagnosing trust breakdowns in user journeys",
        "building products that feel as good as they work",
        "behavioral science applied to real product decisions"
      ];

      const copyEl = document.getElementById("spiral-copy");
      if (copyEl) {
        let index = 0;
        const rotatePhrase = () => {
          copyEl.classList.add("is-hidden");
          window.setTimeout(() => {
            index = (index + 1) % phrases.length;
            copyEl.textContent = phrases[index];
            copyEl.classList.remove("is-hidden");
          }, 400);
        };
        window.setInterval(rotatePhrase, 3000);
      }

      const canvas = document.getElementById("spiral-canvas");
      if (canvas) {
        const ctx = canvas.getContext("2d");
        const particles = [];
        let width = 0;
        let height = 0;
        let dpr = Math.max(1, window.devicePixelRatio || 1);

        const resize = () => {
          width = canvas.clientWidth;
          height = canvas.clientHeight;
          dpr = Math.max(1, window.devicePixelRatio || 1);
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          particles.length = 0;
          const count = 120;
          for (let i = 0; i < count; i += 1) {
            particles.push(createParticle());
          }
        };

        const createParticle = () => ({
          angle: Math.random() * Math.PI * 2,
          radius: Math.random() * 18 + 4,
          size: Math.random() * 3 + 1,
          speed: Math.random() * 0.8 + 0.2,
          alpha: Math.random() * 0.35 + 0.1
        });

        const resetParticle = (particle) => {
          particle.angle = Math.random() * Math.PI * 2;
          particle.radius = 0;
          particle.size = Math.random() * 3 + 1;
          particle.speed = particle.size * 0.8 + 0.2;
          particle.alpha = Math.min(0.5, 0.1 + particle.size / 8);
        };

        const draw = () => {
          ctx.clearRect(0, 0, width, height);
          const cx = width / 2;
          const cy = height / 2;
          ctx.fillStyle = "#7eb8c9";
          particles.forEach((particle) => {
            particle.angle += 0.03 + particle.speed * 0.008;
            particle.radius += 0.06 + particle.speed * 0.08;
            const x = cx + Math.cos(particle.angle) * particle.radius;
            const y = cy + Math.sin(particle.angle) * particle.radius;
            ctx.globalAlpha = particle.alpha;
            ctx.beginPath();
            ctx.arc(x, y, particle.size, 0, Math.PI * 2);
            ctx.fill();
            if (particle.radius > Math.max(width, height) * 0.6) {
              resetParticle(particle);
            }
          });
          ctx.globalAlpha = 1;
          window.requestAnimationFrame(draw);
        };

        window.addEventListener("resize", resize);
        resize();
        draw();
      }
    </script>
